# 验收/演示轨(spec §1.4):`docker compose up --build` 一次起齐,nginx 发布 :8080
# 唯一入口,全功能可用(列表/编辑/保存/上传/渲染)。
#
# build context = example/ 根。canvas 依赖全部走发布版本:Go 侧 go.mod 直接 require
# module proxy 的 github.com/HankChenCH/go-canvas(+image-renderer),web 侧 package.json
# 直接依赖 npm 的 @hankchen/canvas* 四包——构建期自 registry/proxy 拉取,无本地依赖仓接线。
#
# 出网注意(spec §5.3):机构徽标是唯一外网依赖(picsum),容器需出网;离线演示可把
# dataset 中 org.logo 换成自引用 URL(/assets/u/…)。
# 对外端口由 .env 的 CANVAS_EXAMPLE_PORT 决定(默认 8080),compose 自动读同目录 .env;
# .env 不入 git,首次使用从 .env.example 拷贝。
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    # 端口不发布:仅 compose 网络内经 nginx 反代可达(http://server:8080),
    # 监听 :8080 固定、无配置面(spec §1.4)
    expose:
      - "8080"
    # 运行时数据挂 named volume,活在容器生命周期之外:否则 up --build 重建容器
    # 时可写层被丢弃,SQLite/上传资产/渲染产物全部丢失。.cache/ 是物化缓存,
    # 丢了自建,不挂。
    volumes:
      - server-data:/app/data
      - server-uploads:/app/assets/u
      - server-renders:/app/renders

  nginx:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${CANVAS_EXAMPLE_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  server-data:
  server-uploads:
  server-renders:
