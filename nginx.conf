# example 验收轨反代(spec §1.4):`/` 服务 dist 静态 + SPA fallback;
# /api /assets /renders 反代 compose 网络内 Go server(http://server:8080)。
# 与 dev 轨 vite proxy 三前缀(§1.3)同形,两轨同源、服务端不实现 CORS(§2.1)。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限的单一权威在 server(spec §2.1/§2.5:MaxBytesReader 10MB → JSON 413
    # request_too_large)——nginx 不设限(client_max_body_size 0),任何超限体都由
    # server 返回统一 JSON 信封;nginx 自身 1m 默认会先拦成 HTML 413,违背错误体统一。
    client_max_body_size 0;

    # 渲染 30s deadline(spec §2.6):默认读超时 60s 足够覆盖,显式声明口径
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # 反代三前缀合一(正则 location 优先于 prefix 的 location /):upstream 用变量 +
    # Docker 内嵌 DNS(127.0.0.11)运行期解析——静态写 proxy_pass http://server:8080
    # 会在起动期一次性解析,compose 首起网络未就绪时 nginx 直接 emerg 退出;变量形态
    # 把解析推迟到请求期,一次起齐。proxy_pass 变量不带 URI 部分,原始请求路径原样
    # 透传(server 路由含前缀)。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback:静态文件不存在回落 index.html(前端路由 /、/editor/:id)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|assets|renders)(/|$) {
        set $upstream http://server:8080;
        proxy_pass $upstream;
    }
}
